include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - comment_references
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - unnecessary_lambdas
    - unnecessary_parenthesis
